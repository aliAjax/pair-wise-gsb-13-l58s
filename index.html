<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>加油站班次交接 · 按价格段拆账</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">⛽</span>
          <div>
            <h1>加油站班次交接</h1>
            <p>班中调价按价格段拆账 · 泵码接续校验 · 长短款原因复核 · 冻结凭证留痕订正</p>
          </div>
        </div>
        <div class="role-switch" role="group" aria-label="当前身份">
          <span class="role-label">当前身份</span>
          <button type="button" class="role-btn" data-role="attendant">营业员</button>
          <button type="button" class="role-btn" data-role="manager">站长</button>
        </div>
      </div>
    </header>

    <main id="view" class="view"><!-- 由 js/app.js 渲染 --></main>

    <div id="toast" class="toast" role="status"></div>

    <!-- 分层加载：规则层 → 存储层 → 交互层（均为普通脚本，file:// 直接双击也能运行，无需构建与依赖） -->
    <script src="js/rules.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
